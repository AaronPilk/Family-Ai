# Supabase project config — see https://supabase.com/docs/guides/cli/config
# Project ref on supabase.com: yaogxksbhpiqmgjuuqnj (FamLink org)
project_id = "famlink"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version. Bumped from 15 → 17
# after `supabase link` reported the mismatch.
major_version = 17

[db.seed]
enabled = true
# Supabase CLI executes each file verbatim — psql backslash commands like \i are not supported.
# Point at the real seed files directly so they run as plain SQL.
sql_paths = ["../packages/db/seeds/prompt_templates.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
# Deep-link scheme for magic-link redirects. Must match the iOS/Android
# URL scheme registered in app.json (apps/mobile/app.json: scheme = "famlink").
site_url = "famlink://"
additional_redirect_urls = ["famlink://**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"
url = ""
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# Per-function settings. Anything not listed defaults to verify_jwt = true.
[functions.send_push]
# JWT verify must be OFF because this project uses the new sb_publishable_/
# sb_secret_ API key system. pg_net calls send_push with the auto-injected
# SUPABASE_SERVICE_ROLE_KEY (an sb_secret_... string on new-key projects),
# which is NOT a JWT. With verify_jwt = true, Supabase's edge gateway
# rejects the request as UNAUTHORIZED_INVALID_JWT_FORMAT before our code
# runs. With it off, the bearer reaches the function and our internal
# `bearer === SERVICE_ROLE` check handles auth. See:
# - migration 20260522000018_push_helper_vault.sql
# - memory: famlink-supabase-new-key-system
verify_jwt = false

[analytics]
enabled = false
